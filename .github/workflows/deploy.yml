name: Deploy CDN Service to Cloudflare

on:
  push:
    branches:
      - stage
      - main
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run tests
        run: pnpm exec vitest run

      - name: Run typecheck
        run: pnpm run typecheck

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://scry-cdn-service-dev.epinnock.workers.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: '4.99.0'
          # command is parsed as arguments, so compute the timestamp in a shell above.
          command: >-
            deploy --env staging
            --var SCRY_COMMIT:${{ github.sha }}
            --var SCRY_BRANCH:${{ github.ref_name }}
            --var SCRY_BUILD_TIME:${{ steps.stamp.outputs.built_at }}
            --var SCRY_DEPLOY_ID:${{ github.run_id }}
            --var SCRY_ACTOR:${{ github.actor }}
            --tag ${{ github.sha }}
            --message "${{ github.ref_name }} ${{ github.actor }} run=${{ github.run_id }}"

      - name: Verify deployment
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            if commit=$(curl -fsS https://scry-cdn-service-dev.epinnock.workers.dev/healthz | jq -er '.commit') && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Verified deployment: $commit"
              exit 0
            fi
            echo "Deployment not verified (attempt $attempt/6)"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Staging /healthz did not report commit $EXPECTED_COMMIT"
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://view.scrymore.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: '4.99.0'
          # command is parsed as arguments, so compute the timestamp in a shell above.
          command: >-
            deploy --env production
            --var SCRY_COMMIT:${{ github.sha }}
            --var SCRY_BRANCH:${{ github.ref_name }}
            --var SCRY_BUILD_TIME:${{ steps.stamp.outputs.built_at }}
            --var SCRY_DEPLOY_ID:${{ github.run_id }}
            --var SCRY_ACTOR:${{ github.actor }}
            --tag ${{ github.sha }}
            --message "${{ github.ref_name }} ${{ github.actor }} run=${{ github.run_id }}"

      - name: Verify deployment
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            if commit=$(curl -fsS https://view.scrymore.com/healthz | jq -er '.commit') && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Verified deployment: $commit"
              exit 0
            fi
            echo "Deployment not verified (attempt $attempt/6)"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Production /healthz did not report commit $EXPECTED_COMMIT"
          exit 1
